# Redraws the skyline every night and publishes skyline.svg to an `output`
# branch so main stays clean. Based on skyline's examples/profile-workflow.yml.
name: skyline

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Draw skyline
        # Themes: neon, synthwave, matrix, amber, ice, sunset, toxic, vapor,
        # crimson, mono, prism, rainbow
        env:
          # Optional: add a SKYLINE_TOKEN secret (classic PAT, read:user) to
          # include private contributions. Falls back to the workflow token.
          GITHUB_TOKEN: ${{ secrets.SKYLINE_TOKEN || secrets.GITHUB_TOKEN }}
        # Pinned to an exact commit (2026-10-03) instead of @latest, so new
        # upstream code never runs on this account without a deliberate bump.
        run: go run github.com/pinkpixel-dev/skyline@4037d6c88f50c14bff1bce211b62a86f1f3c06fb -theme neon -svg skyline.svg "${{ github.repository_owner }}"

      - name: Publish to output branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out && mv skyline.svg out/ && cd out
          git init -q -b output
          git add skyline.svg
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -qm "Update skyline"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" output
